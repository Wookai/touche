# CI for touche (ADR 0001). The repo ruleset requires one check named "ci";
# the "ci" job reports the result of every check job under that name.
#
# On a push to main (and on manual dispatch from main) the same run deploys
# web/ to GitHub Pages, but only after every check job passed: a red main
# never ships. Pull requests build web/ and stop there.
#
# Tool versions live in `env:` with a `# renovate:` comment each, so Renovate
# bumps them (renovate.json extends customManagers:githubActionsVersions).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress. Runs on
# main always finish, so main never shows a cancelled run in place of a result
# and deploys are never interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.5
  # renovate: datasource=pypi depName=actionlint-py
  ACTIONLINT_VERSION: 1.7.12.25
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.31.1
  # renovate: datasource=pypi depName=deptry
  DEPTRY_VERSION: 0.25.1
  # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.*)$
  GITLEAKS_VERSION: 8.30.1

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Workflows (actionlint, zizmor)
        run: |
          uvx --from "actionlint-py==$ACTIONLINT_VERSION" actionlint
          uvx "zizmor==$ZIZMOR_VERSION" --offline --min-severity medium --config .github/zizmor.yml .github/

      # The archive is checked against the checksums file of the same release,
      # so a Renovate bump is a one-line change. This catches a corrupt or
      # swapped download, not a tampered release; GitHub's own secret scanning
      # and push protection are on, gitleaks is the second net.
      - name: Secrets in history (gitleaks)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" > "$RUNNER_TEMP/checksum"
          (cd "$RUNNER_TEMP" && sha256sum -c checksum)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

      - name: Shell scripts (shellcheck)
        run: |
          mapfile -t files < <(
            git ls-files | while read -r f; do
              [[ -f "$f" ]] || continue
              case "$f" in *.sh) echo "$f"; continue ;; esac
              head -n1 "$f" | grep -qE '^#!.*[/ ](ba)?sh$' && echo "$f"
            done
          )
          if (( ${#files[@]} == 0 )); then echo "no shell scripts"; exit 0; fi
          shellcheck "${files[@]}"

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Types (basedpyright)
        run: uv run basedpyright

      - name: Dependencies declared and used (deptry)
        run: uv run --with "deptry==$DEPTRY_VERSION" deptry .

      - name: Tests (pytest)
        run: uv run pytest --cov --cov-branch --cov-fail-under=80

  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Types (tsc; engine has no DOM or Node globals)
        run: npm run typecheck

      - name: Tests (vitest; engine and web)
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the site for deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  ci:
    name: ci
    needs: [repo, python, node]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the result of every check as "ci"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do test "$r" = success; done

  deploy:
    name: deploy
    # Only main deploys; the github-pages environment refuses any other branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [repo, python, node]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # OIDC token deploy-pages uses to prove the run's identity
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
